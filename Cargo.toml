[workspace]
resolver = "2"
members = [
    "crates/canboat-core",
    "crates/canboat-io",
    "crates/canboat-tokio",
    "crates/canboat-cli",
    "crates/analyzer",
    "crates/actisense-serial",
    "crates/ikonvert-serial",
    "crates/maretron-ipg",
    "crates/replay",
    "crates/candump2analyzer",
    "crates/pcap2candump",
    "crates/socketcan-writer",
    "crates/n2kd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Kees Verruijt <kees@verruijt.net>"]
repository = "https://github.com/canboat/canboat-rs"
rust-version = "1.77"

[workspace.dependencies]
canboat-core = { path = "crates/canboat-core", version = "0.1.0" }
canboat-io   = { path = "crates/canboat-io",   version = "0.1.0" }
canboat-cli  = { path = "crates/canboat-cli",  version = "0.1.0" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
log        = "0.4"
smallvec   = { version = "1", features = ["union"] }

clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
env_logger = "0.11"
serialport = "4"

tokio        = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "macros", "sync"] }
tokio-serial = "5"
futures      = "0.3"

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = true
