# CI for the canboat-rs Cargo workspace.
#
# Jobs:
#   - test:   build + full test suite on Linux / macOS / Windows. On the
#             Unix runners the canboat C repo is checked out at a pinned
#             ref so the analyzer golden tests run against real fixtures
#             (CANBOAT_GOLDEN=required turns a missing fixture dir into a
#             hard failure instead of a silent skip). Windows skips the
#             golden fixtures for now: the runner's git checks fixtures
#             out with CRLF line endings, which breaks the byte-exact
#             diffs.
#   - schema-pin: the vendored crates/canboat-core/data/canboat.json must
#             be byte-identical to docs/canboat.json at the canboat ref
#             recorded in crates/canboat-core/data/CANBOAT_REF. That ref
#             is also where the golden fixtures are checked out, so the
#             schema and the fixtures can never drift apart.
#   - msrv:   `cargo check` with the workspace's declared rust-version.
#   - clippy: -D warnings, all targets.
#   - fmt:    rustfmt check.
#   - docs:   generate the `canboat` facade rustdoc for each supported
#             library feature set with -D warnings, so a broken intra-doc
#             link or an undocumented public item fails the build. Mirrors
#             the feature sets locked by scripts/check-public-api.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs when a newer commit arrives on the same PR /
# branch; main is excluded so its runs always complete.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read canboat schema pin
        id: pin
        shell: bash
        run: echo "ref=$(cat crates/canboat-core/data/CANBOAT_REF)" >> "$GITHUB_OUTPUT"

      # The fixtures come from the same canboat commit the vendored
      # schema was copied from (see the schema-pin job), so golden
      # output and schema always agree. `make sync-canboat REF=...`
      # updates both the json and the pin together.
      - name: Checkout canboat golden fixtures
        if: runner.os != 'Windows'
        uses: actions/checkout@v6
        with:
          repository: canboat/canboat
          ref: ${{ steps.pin.outputs.ref }}
          path: canboat-fixtures

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test (golden fixtures required)
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
        env:
          CANBOAT_DIR: ${{ github.workspace }}/canboat-fixtures
          CANBOAT_GOLDEN: required

      - name: Test
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked

  schema-pin:
    name: Schema matches pinned canboat ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read canboat schema pin
        id: pin
        run: echo "ref=$(cat crates/canboat-core/data/CANBOAT_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canboat
        uses: actions/checkout@v6
        with:
          repository: canboat/canboat
          ref: ${{ steps.pin.outputs.ref }}
          path: canboat-pinned

      - name: Vendored canboat.json must be byte-identical to the pin
        run: |
          if ! cmp crates/canboat-core/data/canboat.json canboat-pinned/docs/canboat.json; then
            echo "::error::crates/canboat-core/data/canboat.json differs from docs/canboat.json at the ref in CANBOAT_REF. Run 'make sync-canboat REF=<ref>' and commit both files."
            exit 1
          fi

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # Build the facade docs for each supported library feature set. A
      # broken intra-doc link or a missing doc (the crate denies
      # missing_docs under `decode`) fails the build. The feature sets
      # match scripts/check-public-api.sh so the documented surface tracks
      # the locked public surface.
      - name: Generate library rustdoc (-D warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          for set in \
            "decode" \
            "decode,io,wire,nmea0183,ais" \
            "decode,io,wire,node,bridge,nmea0183,ais"; do
            echo "::group::cargo doc --features $set"
            cargo doc --no-deps -p canboat --no-default-features --features "$set" --locked
            echo "::endgroup::"
          done
