[package]
name        = "canboat-tui"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
rust-version = { workspace = true }
description = "Interactive terminal UI for an NMEA 2000 bus, fed by n2kd or canboat-pipeline."

[[bin]]
name = "canboat-tui"
path = "src/main.rs"

[dependencies]
canboat-core = { workspace = true }
canboat-io   = { workspace = true }
canboat-cli  = { workspace = true }
analyzer     = { path = "../analyzer", version = "0.4.0" } # x-release-please-version
anyhow       = { workspace = true }
clap         = { workspace = true }
env_logger   = { workspace = true }
log          = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true, features = ["preserve_order"] }
tokio        = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "macros", "sync", "net", "time", "fs"] }
crossterm    = { version = "0.28", features = ["event-stream"] }
ratatui      = "0.29"
indexmap     = { workspace = true }
futures      = { workspace = true }
# Local-time formatting for the file browser. `clock` pulls the OS
# timezone (cross-platform, incl. Windows) and, unlike the `time` crate,
# resolves the local offset fine under our multi-threaded runtime.
chrono       = { version = "0.4", default-features = false, features = ["clock"] }
