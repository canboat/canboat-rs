# (C) 2009-2026, Kees Verruijt, Harlingen, The Netherlands.

[package]
name         = "canboat-bridge"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
rust-version = { workspace = true }
description  = "The canboat live-bus pipeline (device → decode → quirks → serving); hosts the server and n2kd."

[dependencies]
canboat-core = { workspace = true }
canboat-io   = { workspace = true }
canboat-wire = { workspace = true }
canboat-cli  = { workspace = true }
anyhow       = { workspace = true }
clap         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true, features = ["preserve_order"] }
log          = { workspace = true }
env_logger   = { workspace = true }
# The WMM quirk computes magnetic variation locally.
world_magnetic_model = "0.4.0"

[build-dependencies]
# Capture the git short SHA (+ dirty flag) for the analyzer version banner.
vergen-gitcl = { version = "1", default-features = false }
